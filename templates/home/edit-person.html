<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Person</title>
</head>

<body>

    <form method="post" action="/update-person/{{ person.id }}">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ person.name }}">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ person.email }}">
        <br>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" value="{{ person.address }}">
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ person.age }}">
        <br>

        <button type="submit">Update Person</button>
    </form>

</body>

</html>
